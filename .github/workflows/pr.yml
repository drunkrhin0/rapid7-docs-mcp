name: PR Checks
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    runs-on: docker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Dockerfile lint
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile

      # Python lint
      - uses: astral-sh/setup-uv@v5
      - name: Install Python lint tools
        run: uv pip install --system ruff mypy
      - run: ruff check server/
      - run: mypy server/ --config-file server/pyproject.toml

      # TypeScript lint
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    runs-on: docker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Python tests
      - uses: astral-sh/setup-uv@v5
      - name: Install Python test deps
        run: uv pip install --system pytest fastmcp pyyaml
      - run: pytest server/tests/ -v

      # TypeScript tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run

  sast:
    runs-on: docker
    continue-on-error: true # SARIF upload requires GitHub; non-blocking on Forgejo
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dep-vulns:
    runs-on: docker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

      - uses: astral-sh/setup-uv@v5
      - name: Install deps + pip-audit
        run: uv pip install --system fastmcp pyyaml pip-audit
      - run: pip-audit

  docker-scan:
    runs-on: docker
    continue-on-error: true # SARIF upload requires GitHub; non-blocking on Forgejo
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL


