version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      patches:
        applies-to: version-updates
        update-types:
          - patch
      minors:
        applies-to: version-updates
        update-types:
          - minor
    ignore:
      - dependency-name: '@modelcontextprotocol/sdk'
        update-types:
          - major
