name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
        with:
          fetch-depth: 0

      # ── Python lint ───────────────────────────────────────────────
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Ruff check
        run: ruff check server/

      # ── TypeScript lint ───────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Commitlint
        # Commitlint is informational on PRs. If a commit doesn't
        # follow conventional format, we report but don't block.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.11'
      - name: Install Python deps
        # mypy needs fastmcp and pytest installed to find their type
        # stubs. Install all deps from server/pyproject.toml.
        run: pip install --quiet mypy fastmcp 'pytest>=8' pyyaml
      - name: tsc --noEmit
        run: npm run typecheck
      - name: mypy (strict)
        run: mypy server/ --config-file server/pyproject.toml

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.11'
      - name: Install Python test deps
        run: pip install --quiet pytest fastmcp pyyaml
      - name: vitest
        run: npm test
      - name: pytest
        run: pytest server/tests/ -v

  stemmer-parity:
    name: Stemmer Parity
    # Documents require this. Cheap to run, high signal.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.11'
      - name: Run parity check
        run: |
          # Cross-validate Node and Python stemmers on a shared test
          # vector. If outputs differ, search will silently break.
          #
          # Uses `npx tsx` to load the TypeScript file (Node 20 cannot
          # import .ts files natively).
          #
          # Compares parsed JSON (not raw text) so whitespace differences
          # between the two JSON serializers don't trigger false failures.
          npx tsx -e "
            import { stem, tokenize } from './src/text.ts';
            const words = ['running', 'jumps', 'easily', 'national', 'connection', 'authentication'];
            console.log(JSON.stringify({ stems: words.map(stem), tokens: tokenize('the quick brown fox jumps over the lazy dog') }));
          " > /tmp/node-output.json
          cd server && python3 -c "
          import json
          from text import stem, tokenize
          words = ['running', 'jumps', 'easily', 'national', 'connection', 'authentication']
          print(json.dumps({'stems': [stem(w) for w in words], 'tokens': tokenize('the quick brown fox jumps over the lazy dog')}))
          " > /tmp/py-output.json
          python3 -c "
          import json, sys
          a = json.load(open('/tmp/node-output.json'))
          b = json.load(open('/tmp/py-output.json'))
          if a != b:
              print('STEMMER MISMATCH:')
              print('  node:', a)
              print('  python:', b)
              sys.exit(1)
          print('Stemmer parity OK')
          "

  audit:
    name: Dep Audits
    runs-on: ubuntu-22.04
    # Audit findings are reported, not gating. Use `|| true` so the
    # step always exits 0 and findings surface in the run log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit
        run: npm audit --audit-level=high || true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.11'
      - name: pip-audit
        run: pip install --quiet fastmcp pyyaml pip-audit && pip-audit; true
