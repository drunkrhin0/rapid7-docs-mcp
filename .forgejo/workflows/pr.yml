name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python lint ───────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Ruff check
        run: ruff check server/

      # ── TypeScript lint ───────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Commitlint
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
        if: github.event_name == 'pull_request'

  typecheck:
    name: Type Check
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mypy
        run: pip install --quiet mypy
      - name: tsc --noEmit
        run: npm run typecheck
      - name: mypy (strict)
        run: mypy server/ --config-file server/pyproject.toml

  test:
    name: Test
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test deps
        run: pip install --quiet pytest fastmcp pyyaml
      - name: vitest
        run: npm test
      - name: pytest
        run: pytest server/tests/ -v

  stemmer-parity:
    name: Stemmer Parity
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run parity check
        run: |
          # Cross-validate Node and Python stemmers on a shared test vector.
          # If outputs differ, search will silently break.
          #
          # Uses `npx tsx` to load the TypeScript file (Node 20 cannot
          # import .ts files natively).
          #
          # Compares parsed JSON (not raw text) so whitespace differences
          # between the two JSON serializers don't trigger false failures.
          npx tsx -e "
            import { stem, tokenize } from './src/text.ts';
            const words = ['running', 'jumps', 'easily', 'national', 'connection', 'authentication'];
            console.log(JSON.stringify({ stems: words.map(stem), tokens: tokenize('the quick brown fox jumps over the lazy dog') }));
          " > /tmp/node-output.json
          cd server && python3 -c "
          import json
          from text import stem, tokenize
          words = ['running', 'jumps', 'easily', 'national', 'connection', 'authentication']
          print(json.dumps({'stems': [stem(w) for w in words], 'tokens': tokenize('the quick brown fox jumps over the lazy dog')}))
          " > /tmp/py-output.json
          python3 -c "
          import json, sys
          a = json.load(open('/tmp/node-output.json'))
          b = json.load(open('/tmp/py-output.json'))
          if a != b:
              print('STEMMER MISMATCH:')
              print('  node:', a)
              print('  python:', b)
              sys.exit(1)
          print('Stemmer parity OK')
          "

  audit:
    name: Dep Audits
    runs-on: docker
    # Audit findings are reported, not gating. Append || true so the
    # job is always green and findings surface in the run log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit
        # Use `; true` so the step always exits 0, regardless of whether
        # pip-audit found vulnerabilities or not.
        run: pip install --quiet fastmcp pyyaml pip-audit && pip-audit; true

  sast:
    name: SAST
    runs-on: docker
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Use direct Docker images for gitleaks/trivy. The Forgejo Actions
      # mirror at data.forgejo.org doesn't have gitleaks/gitleaks-action
      # or aquasecurity/trivy-action. Direct images bypass the mirror.
      - name: gitleaks
        uses: docker://zricethezav/gitleaks:v8.21.2
        with:
          args: detect --redact --no-banner --source . --exit-code 0

      - name: trivy fs scan
        uses: docker://aquasec/trivy:0.58.1
        with:
          args: fs --severity HIGH,CRITICAL --no-progress --exit-code 0 .

  workflow-lint:
    name: Workflow & Shell Lint
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        # Only scan the new workflows. Old .github/workflows/ files are
        # kept for brownout and use a custom "docker" runner label that
        # actionlint doesn't recognise.
        #
        # -config-file picks up the self-hosted-runner labels declared in
        # .github/actionlint.yaml so the "docker" label isn't flagged.
        uses: docker://rhysd/actionlint:1.6.27
        with:
          args: -color -config-file .github/actionlint.yaml .forgejo/workflows/pr.yml .forgejo/workflows/main.yml .forgejo/workflows/release.yml .forgejo/workflows/nightly.yml .forgejo/workflows/mirror.yml

      - name: shellcheck
        uses: docker://koalaman/shellcheck-alpine:v0.10.0
        with:
          args: docker-entrypoint.sh
