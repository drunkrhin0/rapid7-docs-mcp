name: Mirror to GitHub

# Fires AFTER release.yml completes successfully, so the tag only lands
# on GitHub once the Forgejo release + GHCR images are in place. Avoids
# the race where mirror pushes a tag to GitHub before release.yml
# finishes (which would let any still-active GitHub-side workflows
# fire on incomplete artifacts during brownout).
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read

jobs:
  mirror-tag:
    name: Push tag to GitHub
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Push tag to GitHub mirror
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT secret is not set. Cannot mirror to GitHub."
            exit 1
          fi
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::head_sha missing from workflow_run event. Cannot mirror."
            exit 1
          fi
          # head_branch is empty for tag pushes on GitHub Actions and
          # may also be empty on Forgejo. Resolve the tag name from
          # head_sha instead — always populated.
          TAG=$(git tag --points-at "$HEAD_SHA")
          if [ -z "$TAG" ]; then
            echo "::error::No tag points at $HEAD_SHA. The Release workflow must have created one."
            exit 1
          fi
          # Defensive: only mirror tags (not branches). The mirror
          # exists for tag artifacts, not branch sync.
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Ref $TAG is not a version tag (must start with 'v'). Refusing to mirror."
              exit 1
              ;;
          esac
          # Use extraHeader instead of embedding the PAT in the URL — avoids
          # log-leak risk if git ever logs the remote URL.
          git -c http.extraHeader="Authorization: Bearer ${GH_PAT}" \
              push https://github.com/drunkrhin0/rapid7-docs-mcp.git "$TAG"
          echo "Mirrored tag $TAG to github.com/drunkrhin0/rapid7-docs-mcp"
