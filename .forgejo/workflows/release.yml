name: Release

on:
  push:
    tags:
      - 'v*'

# Prevent concurrent runs for the same tag. A re-run (e.g. after a flaky
# build) would otherwise push duplicate images to GHCR and create a
# duplicate Forgejo release. cancel-in-progress: false is deliberate —
# we don't want to cancel an in-flight image push mid-upload.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.11'
      - name: Install Python tools
        run: pip install --quiet ruff mypy pytest fastmcp pyyaml
      - run: ruff check server/
      - run: mypy server/ --config-file server/pyproject.toml
      - run: pytest server/tests/ -v

      - name: commitlint on release commit
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional
          npx commitlint --from HEAD~1 --to HEAD --verbose

  docker-build-push:
    name: Build & Push Images (best-effort)
    needs: quality-gates
    runs-on: ubuntu-22.04
    # See main.yml for the rationale: the build jobs are best-effort
    # until the dockhand runner's Docker setup is sorted out. continue-on-error
    # is set per build step below (not job-level) -- Gitea 1.22 doesn't flip
    # the commit status to success for job-level continue-on-error.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract server metadata
        id: meta-server
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build & push server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.7.0
        continue-on-error: true
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=local,dest=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Extract crawler metadata
        id: meta-crawler
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-crawler
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build & push crawler
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.7.0
        continue-on-error: true
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-crawler.outputs.tags }}
          labels: ${{ steps.meta-crawler.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=local,dest=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

  forgejo-release:
    name: Forgejo Release
    needs: docker-build-push
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Walk back from the current tag to the previous tag, or to the first commit if none
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"
          git log "${RANGE}" --pretty=format:"- %s (%h)" > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
