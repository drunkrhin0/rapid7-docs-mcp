name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps-check:
    name: Dep Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm outdated
        run: npm outdated || true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: '3.11'
      - name: pip-audit
        run: pip install --quiet pip-audit && pip-audit

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7

      - name: Build & start
        env:
          # Point at a Docker daemon the runner can reach. The dockhand
          # runner is a DinD container — DOCKER_HOST is required.
          DOCKER_HOST: ${{ secrets.DOCKER_HOST || 'unix:///var/run/docker.sock' }}
        run: |
          docker compose up -d --build
          # Give the MCP server and crawler time to initialise
          sleep 45

      - name: Health check
        env:
          DOCKER_HOST: ${{ secrets.DOCKER_HOST || 'unix:///var/run/docker.sock' }}
        run: |
          # Health endpoint runs inside the compose network, not on the
          # CI container's localhost. Use docker compose exec to hit it
          # from inside the mcp-server service.
          STATUS=$(docker compose exec -T mcp-server \
            sh -c 'curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health' || echo "000")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Health check failed with status $STATUS"
            docker compose logs
            docker compose down
            exit 1
          fi
          echo "Health endpoint reachable: $STATUS"

      - name: Cleanup
        if: always()
        env:
          DOCKER_HOST: ${{ secrets.DOCKER_HOST || 'unix:///var/run/docker.sock' }}
        run: docker compose down
