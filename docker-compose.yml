services:
  # ── Rapid7 Docs MCP Server (FastMCP/Python, Streamable HTTP) ──────────────
  mcp-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${MCP_PORT:-8000}:8000"
      - "${HEALTH_PORT:-8001}:8001"
    volumes:
      - docs_data:/app/docs
      - site_data:/app/data
    environment:
      - MCP_PORT=8000
      - HEALTH_PORT=8001
      - MCP_API_KEYS=${MCP_API_KEYS:-}
      - MCP_RATE_LIMIT=${MCP_RATE_LIMIT:-60}
    restart: unless-stopped

  # ── Crawler (Node.js, cron-scheduled) ────────────────────────────────────
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - docs_data:/app/docs
      - site_data:/app/data
    environment:
      - CRAWL_SECTIONS=${CRAWL_SECTIONS:-}
      - CRAWL_SCHEDULE=${CRAWL_SCHEDULE:-0 2 * * *}
      - CRAWL_DELAY_MS=${CRAWL_DELAY_MS:-0}
      - CRAWL_EXTENSIONS=${CRAWL_EXTENSIONS:-true}
      - EXTENSIONS_CRAWL_SCHEDULE=${EXTENSIONS_CRAWL_SCHEDULE:-0 3 * * 0}
      - CRAWL_SITE=${CRAWL_SITE:-true}
      - SITE_CRAWL_SCHEDULE=${SITE_CRAWL_SCHEDULE:-0 4 * * 0}
      - CRAWL_EXTERNAL=${CRAWL_EXTERNAL:-false}
      - EXTERNAL_CRAWL_SCHEDULE=${EXTERNAL_CRAWL_SCHEDULE:-0 5 * * 0}
      - TZ=${TZ:-UTC}
    restart: unless-stopped

volumes:
  docs_data:
  site_data:
