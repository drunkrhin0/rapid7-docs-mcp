services:
  rapid7-docs-mcp:
    image: rapid7-docs-mcp:latest
    ports:
      - "7000:7000"
    volumes:
      - docs-data:/app/docs
      - site-data:/app/data
    environment:
      - MCP_TRANSPORT=http
      - PORT=7000
      # Leave empty to crawl all products (auto-discovered from homepage), or specify sections e.g. insightidr incident-command
      - CRAWL_SECTIONS=
      - CRAWL_SCHEDULE=0 2 * * *   # daily at 2am
      - CRAWL_DELAY_MS=0            # ms between requests (0 = no artificial delay; CDN-backed)
      - CRAWL_EXTENSIONS=true       # set to false to skip extensions
      - EXTENSIONS_CRAWL_SCHEDULE=0 3 * * 0  # weekly at 3am Sunday
      - CRAWL_SITE=true             # set to false to skip site crawl (products/blog/resources)
      - SITE_CRAWL_SCHEDULE=0 4 * * 0  # weekly at 4am Sunday
      - TZ=UTC

    restart: unless-stopped

volumes:
  docs-data:
  site-data:
