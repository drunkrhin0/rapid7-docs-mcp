services:
  rapid7-docs-mcp:
    image: rapid7-docs-mcp:latest
    ports:
      - "7000:7000"
    volumes:
      - docs-data:/app/docs
    environment:
      - MCP_TRANSPORT=http
      - PORT=7000
      - CRAWL_SECTIONS=   # leave empty to crawl all sections - otherwise specify section insightidr insightvm insightappsec insightconnect insightagent insightcloudsec metasploit nexpose appspider insightops threat-command surface-command
      - CRAWL_SCHEDULE=0 2 * * 0   # weekly Sunday 2am — use cron syntax
      - CRAWL_DELAY_MS=15           # ms between requests (~60 req/s)

    restart: unless-stopped

volumes:
  docs-data:
